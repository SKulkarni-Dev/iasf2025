<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger | IUCEE Student Chapter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="messenger.css">
</head>
<body>
<!--
  Production:
  - Same-domain/reverse-proxy deployment: no change required.
  - Separate backend domain: define window.MESSENGER_API_BASE before this script,
    e.g. <script>window.MESSENGER_API_BASE="https://api.example.com/api/messenger";</script>
-->

<div id="authScreen" class="auth-screen">
  <div class="auth-card glass">
    <div class="brand">
      <img src="images/logo.jpeg" alt="IUCEE">
      <div>
        <strong>IUCEE Messenger</strong>
        <span>Private community messaging</span>
      </div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">Login</button>
      <button class="auth-tab" data-mode="signup">Sign Up</button>
    </div>

    <form id="authForm">
      <div id="nameField" class="field hidden">
        <label>Full name</label>
        <input id="authName" type="text" placeholder="Your name">
      </div>
      <div class="field">
        <label>Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="authPassword" type="password" placeholder="••••••••" required minlength="4">
      </div>
      <button class="primary-btn" type="submit" id="authSubmit">Login</button>
      <p id="authMessage" class="auth-message"></p>
    </form>
    <p class="demo-note">Frontend demo only. Accounts and messages are stored locally in this browser for now.</p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="profile-mini">
        <img id="currentAvatar" src="images/iu.png" alt="">
        <div>
          <strong id="currentName">You</strong>
          <span>Online</span>
        </div>
      </div>
      <button id="logoutBtn" class="icon-btn" title="Logout">↪</button>
    </div>

    <div class="search-wrap">
      <span>⌕</span>
      <input id="userSearch" type="search" placeholder="Search people">
    </div>

    <div class="section-label">MESSAGES</div>
    <div id="contactList" class="contact-list"></div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div class="chat-person">
        <img id="chatAvatar" src="images/iu.png" alt="">
        <div>
          <strong id="chatName">Select a person</strong>
          <span id="chatStatus">Choose someone from the left</span>
        </div>
      </div>
      <button class="icon-btn" title="More">•••</button>
    </header>

    <div id="messages" class="messages">
      <div class="empty-chat">
        <div class="empty-icon">💬</div>
        <h2>Your conversations</h2>
        <p>Select a person to start messaging.</p>
      </div>
    </div>

    <form id="messageForm" class="composer">
      <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" disabled>
      <button class="send-btn" type="submit" disabled>Send</button>
    </form>
  </main>
</div>

<script>
window.MESSENGER_API_BASE = "https://iucee-backend.onrender.com/api/messenger";
</script>

<script>
const API_BASE =
  window.MESSENGER_API_BASE ||
  `${window.location.origin}/api/messenger`;
const SESSION_KEY = "messenger_token";

let token = localStorage.getItem(SESSION_KEY);
let currentUser = null;
let users = [];
let selectedUserId = null;
let authMode = "login";

const $ = id => document.getElementById(id);

function authHeaders() {
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${token}`
  };
}

async function api(path, options = {}) {
  const response = await fetch(API_BASE + path, {
    ...options,
    headers: { ...authHeaders(), ...(options.headers || {}) }
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.success === false) {
    throw new Error(data.message || `Request failed (${response.status})`);
  }
  return data;
}

function showError(message) {
  $("authMessage").textContent = message;
}

function showAuth() {
  $("authScreen").classList.remove("hidden");
  $("app").classList.add("hidden");
}

function showApp() {
  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("currentName").textContent = currentUser.name;
  $("currentAvatar").src = currentUser.avatar || "images/iu.png";
  loadUsers();
}

async function loadUsers() {
  try {
    const data = await api("/users");
    users = data.users || [];
    renderContacts();
  } catch (err) {
    console.error(err);
    $("contactList").innerHTML = `<div class="no-results">${escapeHtml(err.message)}</div>`;
  }
}

function renderContacts(filter = "") {
  const q = filter.toLowerCase();
  const visible = users.filter(u =>
    (u.name || "").toLowerCase().includes(q) ||
    (u.email || "").toLowerCase().includes(q)
  );

  $("contactList").innerHTML = visible.map(u => `
    <button class="contact ${selectedUserId === u.id ? "active" : ""}" data-id="${u.id}">
      <div class="avatar-wrap">
        <img src="${u.avatar || "images/iu.png"}" alt="">
      </div>
      <div class="contact-info">
        <strong>${escapeHtml(u.name)}</strong>
        <span>${escapeHtml(u.email || "Available to message")}</span>
      </div>
    </button>
  `).join("") || `<div class="no-results">No users found.</div>`;

  document.querySelectorAll(".contact").forEach(btn => {
    btn.addEventListener("click", () => selectUser(btn.dataset.id));
  });
}

async function selectUser(id) {
  selectedUserId = id;
  const user = users.find(u => u.id === id);
  if (!user) return;

  $("chatAvatar").src = user.avatar || "images/iu.png";
  $("chatName").textContent = user.name;
  $("chatStatus").textContent = "Available to message";
  $("messageInput").disabled = false;
  $("messageForm").querySelector("button").disabled = false;
  renderContacts($("userSearch").value);
  await loadMessages();
}

async function loadMessages() {
  if (!selectedUserId) return;

  try {
    const data = await api(`/messages/${selectedUserId}`);
    const chat = data.messages || [];

    $("messages").innerHTML = chat.length ? chat.map(m => `
      <div class="message-row ${m.sender === currentUser.id ? "mine" : "theirs"}">
        <div class="bubble">${escapeHtml(m.text || "")}</div>
        <span class="message-time">${formatTime(m.createdAt)}</span>
      </div>
    `).join("") : `
      <div class="empty-chat small">
        <div class="empty-icon">✦</div>
        <h2>Start the conversation</h2>
        <p>Send your first message.</p>
      </div>`;

    $("messages").scrollTop = $("messages").scrollHeight;
  } catch (err) {
    $("messages").innerHTML = `
      <div class="empty-chat small">
        <div class="empty-icon">!</div>
        <h2>Couldn't load messages</h2>
        <p>${escapeHtml(err.message)}</p>
      </div>`;
  }
}

async function sendMessage(text) {
  const data = await api(`/messages/${selectedUserId}`, {
    method: "POST",
    body: JSON.stringify({ text })
  });
  return data;
}

document.querySelectorAll(".auth-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    authMode = btn.dataset.mode;
    document.querySelectorAll(".auth-tab").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    $("nameField").classList.toggle("hidden", authMode !== "signup");
    $("authSubmit").textContent = authMode === "signup" ? "Create account" : "Login";
    $("authMessage").textContent = "";
  });
});

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("authSubmit").disabled = true;
  showError("");

  try {
    const body = {
      email: $("authEmail").value.trim().toLowerCase(),
      password: $("authPassword").value
    };

    if (authMode === "signup") {
      body.name = $("authName").value.trim();
    }

    const endpoint = authMode === "signup" ? "/signup" : "/login";
    const response = await fetch(API_BASE + endpoint, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });

    const data = await response.json();

    if (!response.ok || data.success === false) {
      throw new Error(data.message || "Authentication failed.");
    }

    token = data.token;
    currentUser = data.user;
    localStorage.setItem(SESSION_KEY, token);
    showApp();
  } catch (err) {
    showError(err.message);
  } finally {
    $("authSubmit").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem(SESSION_KEY);
  token = null;
  currentUser = null;
  selectedUserId = null;
  users = [];
  showAuth();
});

$("userSearch").addEventListener("input", e => renderContacts(e.target.value));

$("messageForm").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("messageInput");
  const sendBtn = $("messageForm").querySelector("button");
  const text = input.value.trim();

  if (!text || !selectedUserId) return;

  input.disabled = true;
  sendBtn.disabled = true;

  try {
    await sendMessage(text);
    input.value = "";
    await loadMessages();
  } catch (err) {
    alert(err.message);
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});

function formatTime(timestamp) {
  if (!timestamp) return "";
  return new Date(timestamp).toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

async function bootstrap() {
  if (!token) {
    showAuth();
    return;
  }

  try {
    // Validate the stored token by requesting the user list.
    const data = await api("/users");
    users = data.users || [];

    // The API does not expose a current-user endpoint, so use the
    // login form if the browser has no current user object.
    // Keep the current session object separately for the current browser.
    const storedUser = localStorage.getItem("messenger_current_user");
    if (storedUser) {
      currentUser = JSON.parse(storedUser);
      showApp();
    } else {
      localStorage.removeItem(SESSION_KEY);
      token = null;
      showAuth();
    }
  } catch {
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem("messenger_current_user");
    token = null;
    showAuth();
  }
}

// Save current user whenever authentication succeeds.
const originalSetItem = localStorage.setItem.bind(localStorage);
function saveCurrentUser(user) {
  originalSetItem("messenger_current_user", JSON.stringify(user));
}

// Wrap authentication success through a small observer.
const oldShowApp = showApp;
showApp = function() {
  if (currentUser) saveCurrentUser(currentUser);
  oldShowApp();
};

bootstrap();
</script>

</body>
</html>
