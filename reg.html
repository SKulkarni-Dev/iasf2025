<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | IUCEE Student Chapter</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#071322;color:#fff}
#navbar{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:95%;max-width:1280px;z-index:1000;background:rgba(255,255,255,.12);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.22);border-radius:22px;box-shadow:0 10px 35px rgba(0,0,0,.12);transition:.35s}
#navbar.scrolled{background:rgba(255,255,255,.82)}
.nav-link{color:#fff;transition:.3s}
#navbar.scrolled .nav-link{color:#1e293b}
.nav-link:hover{color:#9BE200}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(7,19,34,.85),rgba(7,19,34,.45))}
</style>
</head>
<body>

<header id="navbar">
<div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-4">
<div class="flex items-center gap-5">
<img src="images/logo.png" class="h-12">
<img src="images/iu.png" class="h-12">
</div>
<nav class="hidden md:flex gap-8 font-medium">
<a href="index.html" class="nav-link">Home</a>
<a href="about.html" class="nav-link">About</a>
<a href="mentor.html" class="nav-link">Mentorship</a>
<a href="vol.html" class="nav-link">Team</a>
<a href="iasf25.html" class="nav-link">IASF 2025</a>
<a href="iasf2026.html" class="nav-link">IASF 2026</a>
<a href="com.html" class="nav-link">Community</a>
<a href="reg.html" class="nav-link text-lime-400">Register</a>
</nav>
<a href="reg.html" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-full font-semibold">Join Us</a>
</div>
</header>

<section class="hero relative min-h-screen flex items-center justify-center">
<img src="#" class="absolute inset-0 w-full h-full object-cover">
<div class="relative z-10 w-full max-w-xl px-6">
<div class="glass rounded-3xl p-10">
<h1 class="text-5xl font-black text-center">Join the IUCEE Community</h1>
<p class="text-center text-gray-300 mt-4 mb-8">Register to participate in events, workshops, mentorship programs and community initiatives.</p>

<form id="registrationForm" class="space-y-5">
<input id="fullName" class="w-full rounded-xl bg-white/10 border border-white/20 p-4 outline-none" placeholder="Full Name" required>
<input id="email" type="email" class="w-full rounded-xl bg-white/10 border border-white/20 p-4 outline-none" placeholder="Email Address" required>
<input id="phoneNumber" class="w-full rounded-xl bg-white/10 border border-white/20 p-4 outline-none" placeholder="Phone Number" required>
<select id="areaOfInterest" class="w-full rounded-xl bg-white/10 border border-white/20 p-4 outline-none">
<option>Mentorship</option>
<option>Community Events</option>
<option>Volunteering</option>
<option>Workshops</option>
</select>
<button class="w-full bg-lime-400 hover:bg-lime-500 text-black font-bold py-4 rounded-xl transition">Register Now</button>
</form>
</div>
</div>
</section>

<footer class="border-t border-white/10 py-10 text-center text-gray-400">
© 2026 IUCEE Student Chapter. All Rights Reserved.
</footer>

<script>
const navbar=document.getElementById("navbar");
window.addEventListener("scroll",()=>window.scrollY>60?navbar.classList.add("scrolled"):navbar.classList.remove("scrolled"));

document.getElementById('registrationForm').addEventListener('submit',async function(e){
e.preventDefault();
const formData={
fullName:fullName.value,
email:email.value,
phoneNumber:phoneNumber.value,
areaOfInterest:areaOfInterest.value
};
try{
const response=await fetch('https://iucee-club-backend.onrender.com/api/register',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(formData)
});
const result=await response.json();
if(response.ok){alert(result.message);this.reset();}
else{alert('Error: '+result.message);}
}catch(err){
alert('Could not connect to the server. Please try again later.');
}
});
</script>

</body>
</html>
