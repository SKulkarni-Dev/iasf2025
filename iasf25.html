<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IASF 2025</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#071322;color:#fff}
#navbar{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:95%;max-width:1280px;z-index:1000;background:rgba(255,255,255,.12);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.22);border-radius:22px;box-shadow:0 10px 35px rgba(0,0,0,.12);transition:.35s}
#navbar.scrolled{background:rgba(255,255,255,.82)}
.nav-link{color:#fff;transition:.3s}.nav-link:hover{color:#9BE200}
#navbar.scrolled .nav-link{color:#1e293b}
.join-btn{background:#2563eb;color:#fff;border-radius:999px;padding:.8rem 1.5rem}
.hero:before{content:'';position:absolute;inset:0;background:rgba(7,19,34,.65)}
</style>
</head>
<body>
<header id="navbar"><div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-4">
<div class="flex items-center gap-5"><img src="images/logo.png" class="h-12"><img src="images/iu.png" class="h-12"></div>
<nav class="hidden md:flex gap-8 font-medium">
<a href="index.html" class="nav-link">Home</a><a href="about.html" class="nav-link">About</a><a href="mentor.html" class="nav-link">Mentorship</a><a href="vol.html" class="nav-link">Team</a><a href="iasf25.html" class="nav-link text-lime-400">IASF 2025</a><a href="iasf2026.html" class="nav-link">IASF 2026</a><a href="com.html" class="nav-link">Community</a>
</nav><a href="reg.html" class="join-btn">Join Us</a></div></header>

<section class="hero relative h-screen flex items-center justify-center">
<img src="images/g6.jpg" class="absolute inset-0 w-full h-full object-cover">
<div class="relative z-10 text-center px-6">
<h1 class="text-7xl font-black">IASF 2025</h1>
<p class="mt-6 text-xl text-gray-300">Memories from our participation.</p>
</div></section>

<section class="max-w-7xl mx-auto py-20 px-8">
<h2 class="text-5xl font-bold text-center mb-12">Gallery</h2>
<div class="grid md:grid-cols-3 gap-8">
<div class="rounded-3xl overflow-hidden bg-white/10 backdrop-blur border border-white/10"><img src="images/g1.jpg" class="w-full h-80 object-cover"></div>
<div class="rounded-3xl overflow-hidden bg-white/10 backdrop-blur border border-white/10"><img src="images/g2.jpg" class="w-full h-80 object-cover"></div>

<div class="rounded-3xl overflow-hidden bg-white/10 backdrop-blur border border-white/10"><img src="images/g4.jpg" class="w-full h-80 object-cover"></div>

<div class="rounded-3xl overflow-hidden bg-white/10 backdrop-blur border border-white/10"><img src="images/g7.jpg" class="w-full h-80 object-cover"></div>

</div></section>
<script>
const navbar=document.getElementById('navbar');
window.addEventListener('scroll',()=>window.scrollY>60?navbar.classList.add('scrolled'):navbar.classList.remove('scrolled'));
</script>
</body></html>
