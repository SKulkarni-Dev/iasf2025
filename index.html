
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IASF | Innovation & Sustainability Forum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Inter,sans-serif;background:#f8fafc;}
h1,h2,h3{font-family:Poppins,sans-serif;}

#navbar{
position:fixed;
top:18px;
left:50%;
transform:translateX(-50%);
width:95%;
max-width:1280px;
z-index:1000;
background:rgba(255,255,255,.12);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
border:1px solid rgba(255,255,255,.22);
border-radius:22px;
box-shadow:0 10px 35px rgba(0,0,0,.12);
transition:.35s;
}
#navbar.scrolled{
background:rgba(255,255,255,.82);
backdrop-filter:blur(28px);
-webkit-backdrop-filter:blur(28px);
}
.nav-link{color:#fff;transition:.3s;}
#navbar.scrolled .nav-link{color:#1e293b;}
.nav-link:hover{color:#9BE200;transform:translateY(-2px);}
.join-btn{background:#2563eb;color:#fff;font-weight:600;transition:.3s;}
.join-btn:hover{background:#1d4ed8;}

.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;}
.hero img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
filter:saturate(108%) contrast(104%);
transform:scale(1.02);
}
.hero::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
115deg,
rgba(8,17,31,.82) 0%,
rgba(8,17,31,.58) 35%,
rgba(8,17,31,.32) 68%,
rgba(8,17,31,.12) 100%);
backdrop-filter:blur(3px);
-webkit-backdrop-filter:blur(3px);
}
.hero-content{position:relative;z-index:2;}
</style>
</head>

<body>

<header id="navbar">
<div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-4">

<div class="flex items-center gap-5">
<img src="images/logo.jpeg" class="h-12">
<img src="images/iu.png" class="h-12">
</div>

<nav class="hidden md:flex gap-8 font-medium">
<a href="index.html" class="nav-link">Home</a>
<a href="about.html" class="nav-link">About</a>
<a href="mentor.html" class="nav-link">Mentorship</a>
<a href="vol.html" class="nav-link">Team</a>
<a href="iasf25.html" class="nav-link">IASF 2025</a>
<a href="iasf2026.html" class="nav-link">IASF 2026</a>
<a href="com.html" class="nav-link">Community</a>
</nav>

<a href="reg.html" class="join-btn px-6 py-3 rounded-full">Join Us</a>

</div>
</header>

<section class="hero">

<img src="images/g2.jpg" id="carouselImage">

<div class="hero-content max-w-6xl mx-auto px-8 text-white">

<p class="uppercase tracking-[7px] text-blue-300 mb-4">
AN IUCEE STUDENT CHAPTER
</p>

<h1 id="carouselHeading" class="text-6xl md:text-7xl font-extrabold leading-tight mb-6">
Innovation &<br>Sustainability Forum
</h1>

<p id="carouselText" class="text-xl max-w-2xl leading-8">
Empowering students through innovation, leadership, mentorship and sustainable engineering.
</p>

<div class="flex gap-5 mt-10">
<a href="reg.html" class="join-btn px-8 py-4 rounded-full">Join Community</a>
<a href="about.html" class="border border-white px-8 py-4 rounded-full hover:bg-white hover:text-slate-900 transition">Explore</a>
</div>

</div>

</section>

<script>
const navbar=document.getElementById("navbar");
window.addEventListener("scroll",()=>{window.scrollY>60?navbar.classList.add("scrolled"):navbar.classList.remove("scrolled");});
</script>

</body>
</html>
